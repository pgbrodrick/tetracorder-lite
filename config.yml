##
## Config to be used by ``tetrapy run``
## Reminder: Container paths
## Options can be overridden via CLI: --output ... --data.rfl ... --tetrun.args ["band", 10, ...]
## Syntax ${...} will interpolate values from other parts of the config
## Example: tetrapy run config.yml --data.rfl /data/emit20230728t214153_rfl --data.rfluncert /data/emit20230728t214153_uncert
##
#
# I/O
#
output:
  base: /output/test
  tetracorder: ${output.base}/tetracorder
  tetrapy: ${output.base}/aggregate
data:
  # Data, not header files
  rfl: /data/rfl
  rfluncert: /data/rfluncert
  glt: /data/glt # When set, COGs are orthorectified onto its map grid (omit for raw)
#
# Tetracorder settings
#
tetracorder:
  root: /root/tetracorder
  davinci: True
  version: 6.00a
  sensor: ${sensor.name}
  mode: cube
#
# Pipeline
#
log:
  level: DEBUG
  file: ${output.tetrapy}/tetrapy.log
  append: False # False == Reset the log file
  config: ${output.tetrapy}/config.yml # Exports the working config to the output dir
export_matrix:
  enabled: False
  file: ${output.tetrapy}/matrix.csv
  groups: [1, 2]
  columns: [id, group, library, record, title, path]
  reference: tetrapy/data/v6.00a6.csv
  sortby: [group, index]
  clean_titles: True
convolve:
  enabled: True
  reflib: ${tetracorder.root}/sl1/usgs/library06.conv/splib06b
  reslib: ${tetracorder.root}/sl1/usgs/library06.conv/sprlb06b
  output:
    reflib: /conv/reflib
    reslib: /conv/reslib
  name: ${sensor.name}
sensor:
  enabled: True
  name: tetrapy
  deleted_channels:
    units: um                   # um | nm; inclusive ranges matched against band centres
    wavelengths:
      - [0.38, 0.405]           # detector edge
      - [0.93, 0.963]           # 0.94 um water band
      - [1.11, 1.164]           # 1.13 um water band
      - [1.327, 1.477]          # 1.4 um water band
      - [1.770, 1.968]          # 1.9 um water band
      - [2.455, 2.50]           # detector edge
    channels: "218 219t221 226" # EMIT-specific isolated channels near 2.0 um
  enable:
    groups: [1-5, 18, 20-22, 37-38]
    cases: [1-6]
  colors:
    - BASE     23 23 23  base-image.jpg    # base grayscale image
    - COLOR1   38 23 11  color-visRGB.jpg  # visible color channels
    - COLOR2  246 85 18  color-vir.jpg     # false color vis-IR
  reflib: ${convolve.output.reflib}
  reslib: ${convolve.output.reslib}
setup:
  enabled: True
  geology: False
  args: ["1", "-T", "-20", "80", "C", "-P", ".5", "1.5", "bar"]
tetrun:
  enabled: True
  args: ["band", "20", "gif"]
postprocess:
  enabled: True
  tetracorder: ${output.tetracorder}
  cogs:
    output: ${output.tetrapy}/cogs/
    skip_existing: False
    glt: ${data.glt}
    glob:
      - "results.masses/*.png"
  remove:
    - "results.group*"
    - "results.dual*"
    - "results.case*"
    - "color.results+labels"
    - "color.results-envi"
aggregate:
  enabled: True
  tetracorder: ${output.tetracorder}
  output: ${output.tetrapy}
  reflib: ${convolve.output.reflib}
  reslib: ${convolve.output.reslib}
  out_min: ${output.tetrapy}/agg.nc # Supports .nc or .tif
  out_minuncert: ${output.tetrapy}/agg-uncert.nc # Supports .nc or .tif
  reference: tetrapy/data/v6.00a6.csv
cmf:
  enabled: False                # Independent of tetrun; needs only the convolved libraries
  expert: ${tetracorder.root}/tetracorder.cmds/tetracorder${tetracorder.version}.cmds
  group: 2
  reflib: ${convolve.output.reflib}
  reslib: ${convolve.output.reslib}
  # deleted_channels: defaults to sensor.deleted_channels
  feature_types: [DLw, MLw, OLw, WLw, DCw, MCw, OCw, WCw] # All f-features (linear + curved); NOT
                                # (exclusion) features are never used
  covariance_style: looshrinkage # looshrinkage | empirical (as diffmf)
  fixed_alpha: null             # null == fit by LOO-CV per column
  threshold: 5                  # Scores below this are written as 0 and not ranked
  threshold_type: sigma         # sigma == threshold in background std devs (mf*sqrt(s'C^-1 s)); raw == on MF itself
  rank_depth: 10                # Rank bands kept (must be >= mode.top_n)
  min_pixels: 10
  full_scene: False             # True == one background for the whole image (orthorectified scenes)
  rfl_nodata: -9999             # Reflectance nodata, excluded from the background (null to disable)
  alpha_pixels: 50000           # full_scene: pixels subsampled to fit the shrinkage alpha
  cores: 8
  reuse: False                  # True == reuse existing scores/rank and rerun only the mode
  output:
    scores: ${output.tetrapy}/cmf/group${cmf.group}_scores.tif
    rank: ${output.tetrapy}/cmf/group${cmf.group}_rank.tif
    minerals: ${output.tetrapy}/cmf/group${cmf.group}_minerals.csv
    norm: ${output.tetrapy}/cmf/group${cmf.group}_norm.npy
  mode:
    name: single
    target: "kaol*"             # tetracorder id or glob (or a list of them)
    top_n: 3
    output: ${output.tetrapy}/cmf/group${cmf.group}_single.tif
